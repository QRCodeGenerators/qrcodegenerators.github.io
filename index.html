<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-grad-a: #eef2ff; --bg-grad-b: #f8fafc; --bg-grad-c: #eff6ff;
    --card-bg: #ffffff; --card-border: #f3f4f6;
    --text: #111827; --text-sub: #4b5563; --text-muted: #6b7280; --text-soft: #9ca3af;
    --accent: #1d4bf0; --accent-hover: #1a3fd6; --accent-glow: rgba(29, 75, 240, 0.15);
    --input-border: #e5e7eb; --input-bg: #ffffff;
    --result-bg: #f9fafb; --qr-shadow: rgba(0, 0, 0, 0.08);
    --header-bg: rgba(255, 255, 255, 0.85);
    --err-bg: #fee2e2; --err-text: #b91c1c;
  }
  body.dark {
    --bg-grad-a: #0b1120; --bg-grad-b: #111827; --bg-grad-c: #0f172a;
    --card-bg: #1a2233; --card-border: #2a3446;
    --text: #f3f4f6; --text-sub: #9ca3af; --text-muted: #9ca3af; --text-soft: #6b7280;
    --accent: #4f7cff; --accent-hover: #6b90ff; --accent-glow: rgba(79, 124, 255, 0.2);
    --input-border: #2a3446; --input-bg: #0f1626;
    --result-bg: #0f1626; --qr-shadow: rgba(0, 0, 0, 0.4);
    --header-bg: rgba(17, 24, 39, 0.85);
    --err-bg: #451a1a; --err-text: #fca5a5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg-grad-a) 0%, var(--bg-grad-b) 50%, var(--bg-grad-c) 100%);
    min-height: 100vh;
    color: var(--text);
    display: flex;
    flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }
  .page {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 96px 16px 32px;
  }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    background: var(--header-bg);
    border-bottom: 1px solid var(--card-border);
  }
  .header-inner {
    max-width: 420px;
    margin: 0 auto;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-title svg { color: var(--accent); }
  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px; height: 40px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--card-bg);
    color: var(--text-sub);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, transform 0.1s;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle:active { transform: scale(0.94); }
  body:not(.dark) .icon-sun { display: none; }
  body.dark .icon-moon { display: none; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    box-shadow: 0 20px 45px -12px var(--accent-glow);
    padding: 32px 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    transition: background 0.3s, border-color 0.3s;
  }
  h1 {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 12px;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .subtitle {
    color: var(--text-sub);
    font-size: 15px;
    line-height: 1.5;
    max-width: 300px;
    margin: 0 auto 24px;
  }
  .input-box {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    width: 100%;
    border: 1px solid var(--input-border);
    border-radius: 14px;
    background: var(--input-bg);
    padding: 8px 16px;
    margin-bottom: 16px;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
  }
  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .input-box svg { flex-shrink: 0; color: var(--text-soft); }
  .input-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    color: var(--text);
    background: transparent;
    min-width: 0;
    padding: 8px 0;
    font-family: 'Inter', 'Noto Sans Khmer', 'Khmer OS', system-ui, sans-serif;
  }
  .input-box input::placeholder { color: var(--text-soft); }
  button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 56px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 24px;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.98); }
  .result {
    background: var(--result-bg);
    border-radius: 16px;
    padding: 24px;
    display: none;
    transition: background 0.3s;
  }
  .result.visible { display: block; }
  .qr-wrapper {
    width: 200px;
    height: 200px;
    margin: 0 auto 24px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 4px 12px var(--qr-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .qr-wrapper canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
  .download-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    height: auto;
    margin: 0;
    padding: 0;
  }
  .download-link:hover { text-decoration: underline; background: none; }
  .char-info {
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 12px;
    text-align: left;
  }
  .char-info span { color: var(--accent); font-weight: 600; }
  .error-msg {
    display: none;
    background: var(--err-bg);
    color: var(--err-text);
    font-size: 14px;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 16px;
    text-align: center;
  }
  footer {
    padding: 20px 16px 28px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
  footer a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }
  .heart { color: #ef4444; display: inline-block; animation: beat 1.4s infinite; }
  @keyframes beat { 0%, 40%, 80%, 100% { transform: scale(1); } 20%, 60% { transform: scale(1.25); } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <path d="M14 14h3v3h-3zM17.5 17.5H21V21h-3.5z"/>
      </svg>
      QR Generator
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark / light mode">
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>
</header>

<div class="page">
  <div class="card">
    <h1>QR Code <span>Generator</span></h1>
    <p class="subtitle">Enter any text or URL and generate QR code instantly.</p>

<div class="input-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <input id="textInput" type="text" value="https://example.com" placeholder="Enter text or URL (any language)">
    </div>

<div class="char-info" id="charInfo"></div>
    <div class="error-msg" id="errorMsg"></div>

<button onclick="generate()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <path d="M14 14h3v3h-3zM17.5 17.5H21V21h-3.5z"/>
      </svg>
      Generate QR
    </button>

<div class="result" id="result">
      <div class="qr-wrapper" id="qrWrapper"></div>
      <button class="download-link" onclick="download()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download QR Code
      </button>
    </div>
  </div>
</div>

<footer>
  Created with <span class="heart">&#10084;&#65039;</span> by <a href="https://facebook.com/mizterlai" target="_blank" rel="noopener noreferrer">Lai Honest</a>
</footer>

<script>
  function applyTheme(mode) {
    document.body.classList.toggle('dark', mode === 'dark');
  }
  function toggleTheme() {
    const isDark = document.body.classList.contains('dark');
    const next = isDark ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  }
  const saved = localStorage.getItem('theme');
  applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  let lastCanvas = null;

function byteLength(str) {
    return new TextEncoder().encode(str).length;
  }
  function pickLevel(bytes) {
    if (bytes <= 1200) return 'H';
    if (bytes <= 1600) return 'Q';
    if (bytes <= 2200) return 'M';
    if (bytes <= 2900) return 'L';
    return null;
  }
  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('result').classList.remove('visible');
  }
  function updateCharInfo() {
    const bytes = byteLength(document.getElementById('textInput').value);
    const el = document.getElementById('charInfo');
    el.innerHTML = (bytes > 2200)
      ? '<span>' + bytes + ' bytes</span> \u2014 near the QR limit, code may be dense and hard to scan'
      : '<span>' + bytes + ' bytes</span> / ~2900 max';
  }
  function generate() {
    document.getElementById('errorMsg').style.display = 'none';
    const text = document.getElementById('textInput').value;
    const wrapper = document.getElementById('qrWrapper');
    const result = document.getElementById('result');

if (!text.trim()) { wrapper.innerHTML = ''; lastCanvas = null; result.classList.remove('visible'); return; }

const bytes = byteLength(text);
    const level = pickLevel(bytes);
    if (!level) {
      showError('Text too long (' + bytes + ' bytes). A single QR code holds ~2,950 bytes. Please shorten the text.');
      return;
    }

wrapper.innerHTML = '';
    try {
      const qr = qrcode(0, level);
      qr.addData(text, 'Byte');
      qr.make();

const count = qr.getModuleCount();
      const quiet = 4;
      const scale = Math.max(1, Math.floor(600 / (count + quiet * 2)));
      const dim = (count + quiet * 2) * scale;
      const canvas = document.createElement('canvas');
      canvas.width = dim;
      canvas.height = dim;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, dim, dim);
      ctx.fillStyle = '#111827';
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
          }
        }
      }
      wrapper.appendChild(canvas);
      lastCanvas = canvas;
      result.classList.add('visible');
    } catch (e) {
      showError('Could not generate QR code. The text may be too long. Please shorten it and try again.');
    }
  }
  function download() {
    if (!lastCanvas) return;
    const a = document.createElement('a');
    a.href = lastCanvas.toDataURL('image/png');
    a.download = 'qr-code.png';
    a.click();
  }

document.getElementById('textInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') generate();
  });
  document.getElementById('textInput').addEventListener('input', updateCharInfo);
  updateCharInfo();
</script>
</body>
</html>
